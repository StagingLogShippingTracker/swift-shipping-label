[package]
name = "logo_recreate"
version = "0.1.0"
edition = "2021"
description = "On-device customer-logo Recreate pipeline (bg strip → palette → sectional SVG/PNG)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
name = "logo_recreate"

[dependencies]
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
imageproc = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
