# Fly.io app for premium Python logo Recreate.
# Deploy from the **repo root** (build context = repo root):
#   fly deploy . --config services/recreate-logo/fly.toml

app = "swift-recreate-logo"
primary_region = "ord"

[build]
  # Paths are relative to this config file's directory when using
  # `fly deploy . --config services/recreate-logo/fly.toml`.
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 8
    soft_limit = 4

[[vm]]
  size = "shared-cpu-2x"
  memory = "1024mb"
  cpus = 2
