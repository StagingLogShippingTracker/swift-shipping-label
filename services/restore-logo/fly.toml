# Fly.io app for RealESRGAN logo restore.
# Deploy from the **repo root**:
#   fly deploy . --config services/restore-logo/fly.toml

app = "swift-restore-logo"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"
  ignorefile = ".dockerignore"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

# RealESRGAN 3000px+ restore needs 2048–4096 MB; 4096 avoids OOM on large logos.
[[vm]]
  size = "shared-cpu-2x"
  memory = "4096mb"
  cpus = 2
